<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مع الله · لوحة تشغيل المشروع ١٤٤٨ هـ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#001048; --ink-2:#06255C; --sea:#1C6AAA; --sky:#BBE2FF; --mist:#E7F2FD;
  --paper:#F4F9FE; --card:#FFFFFF; --line:#D3E4F6; --line-soft:#E9F1FA;
  --muted:#5B6E8C; --late:#96241F; --late-bg:#FBEDEB; --done:#136F52; --done-bg:#E6F4EF;
  --warn:#8A5A00; --warn-bg:#FBF2E0;
  --r:10px; --shadow:0 1px 0 rgba(0,16,72,.05);
}
:root:not([data-theme="light"]){ color-scheme: light; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{background:linear-gradient(160deg,#06255C 0%,#001048 70%);color:#fff;padding:18px 20px 0}
.mast-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.mark{height:46px;width:auto;filter:brightness(0) invert(1)}
.mast-title{font-size:20px;font-weight:600;line-height:1.25}
.mast-sub{font-size:13px;color:#A9CDF2;font-weight:400}
.mast-today{margin-inline-start:auto;font-size:13px;color:#BBE2FF;background:rgba(255,255,255,.08);
  padding:6px 12px;border-radius:999px;border:1px solid rgba(187,226,255,.25)}
.rail{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0;max-width:1400px;margin:0 auto;scrollbar-width:thin}
.rail button{background:transparent;border:1px solid rgba(187,226,255,.28);color:#CFE6FC;
  border-radius:8px 8px 0 0;padding:8px 13px;white-space:nowrap;cursor:pointer;border-bottom:none;font-size:13.5px}
.rail button .g{display:block;font-size:10.5px;color:#7FA8D6;letter-spacing:0}
.rail button[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
.rail button[aria-current="true"] .g{color:var(--muted)}
.rail button.now::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#8FD0A5;margin-inline-start:6px;vertical-align:middle}

/* ---------- tabs ---------- */
.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs-in{display:flex;gap:2px;max-width:1400px;margin:0 auto;padding:0 20px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:13px 12px;
  cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14.5px}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs .spacer{margin-inline-start:auto;display:flex;align-items:center;gap:8px;padding:6px 0}

main{max-width:1400px;margin:0 auto;padding:22px 20px 80px}
section[hidden]{display:none}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}

/* ---------- pipeline ---------- */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.lane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;box-shadow:var(--shadow)}
.lane[data-state="late"]{border-color:#E2B3AE}
.lane-step{font-size:12px;color:var(--sea);font-weight:600}
.lane h3{font-size:17px;margin:2px 0 2px}
.lane .win{font-size:12.5px;color:var(--muted)}
.bar{height:7px;background:var(--mist);border-radius:99px;margin:13px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.lane[data-state="late"] .bar i{background:var(--late)}
.lane[data-state="done"] .bar i{background:var(--done)}
.lane-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--mist);color:var(--ink-2)}
.chip.late{background:var(--late-bg);border-color:#EBC9C5;color:var(--late)}
.chip.done{background:var(--done-bg);border-color:#BFE2D6;color:var(--done)}
.chip.warn{background:var(--warn-bg);border-color:#EBDCB6;color:var(--warn)}

.alerts{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:22px}
.alerts h3{font-size:15px;margin-bottom:10px}
.alerts ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.alerts li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;border-inline-start:3px solid var(--late);padding-inline-start:10px}
.alerts li.ok{border-color:var(--done)}
.alerts li .who{color:var(--muted)}

.year{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}
.year h3{font-size:15px;margin-bottom:4px}
.ygrid{display:grid;grid-template-columns:repeat(12,minmax(74px,1fr));gap:6px;margin-top:12px;min-width:920px}
.ycell{border:1px solid var(--line);border-radius:8px;padding:9px 7px;text-align:center;cursor:pointer;background:#fff}
.ycell:hover{border-color:var(--sea)}
.ycell[data-sel="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ycell .m{font-size:12.5px;font-weight:600}
.ycell .g{font-size:10px;color:var(--muted);display:block;margin-bottom:7px}
.dots{display:flex;gap:3px;justify-content:center}
.dot{width:100%;height:5px;border-radius:99px;background:var(--mist)}
.dot i{display:block;height:100%;border-radius:99px;background:var(--sea)}

/* ---------- tables ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.panel-head h2{font-size:16px}
.panel-head .note{font-size:12.5px;color:var(--muted)}
.panel-head .right{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:13.5px}
thead th{background:var(--mist);color:var(--ink-2);font-weight:600;font-size:12.5px;position:sticky;top:0;z-index:2}
tbody tr:hover{background:#FAFCFF}
tr.group td{background:#F7FAFE;font-weight:600;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
td .idx{color:var(--muted);font-size:12px}
input[type=text],input[type=date],input[type=number],input[type=time],textarea,select{
  width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-size:13.5px}
input:hover,textarea:hover,select:hover{border-color:var(--line)}
input:focus,textarea:focus,select:focus{border-color:var(--sea);background:#fff;outline:none}
input::placeholder,textarea::placeholder{color:#9FB3CC}
textarea{resize:vertical;min-height:34px}
select{cursor:pointer;background:#fff;border-color:var(--line)}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:7px;padding:6px 13px;cursor:pointer;font-size:13px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--sea)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{font-size:12px;color:var(--sea);text-decoration:none;white-space:nowrap}
.num{width:64px;text-align:center;border-color:var(--line)}
.counter{display:flex;align-items:center;gap:6px;justify-content:center}
.counter button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1}
.mini-bar{width:62px;height:6px;background:var(--mist);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.mini-bar i{display:block;height:100%;background:var(--sea)}

/* ---------- publish cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px}
.pcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;flex-direction:column}
.thumb{aspect-ratio:9/16;background:linear-gradient(170deg,#DCEDFC,#F2F8FE);display:flex;align-items:center;justify-content:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{color:#8FAACB;font-size:12.5px;text-align:center;padding:0 14px}
.thumb .kind{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,16,72,.82);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
.pbody{padding:11px;display:grid;gap:6px}
.pbody .ptitle{font-weight:600;font-size:14px}
.pbody .cap{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.prow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.upload{font-size:12px}
input[type=file]{font-size:12px;width:100%}

/* ---------- dues ---------- */
.totals{display:flex;gap:18px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line);background:#F7FAFE;font-size:13.5px}
.totals b{font-weight:600}
.tot-num{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- team ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.kv span{font-size:13.5px}

/* ---------- status bar ---------- */
.statusbar{position:fixed;inset-block-end:0;inset-inline-start:0;inset-inline-end:0;background:rgba(0,16,72,.94);color:#CFE6FC;
  font-size:12.5px;padding:7px 20px;display:flex;gap:14px;align-items:center;z-index:30}
.statusbar .dotx{width:7px;height:7px;border-radius:50%;background:#8FD0A5}
.statusbar.off .dotx{background:#E0A24C}
.statusbar .sp{margin-inline-start:auto}

/* ---------- client view ---------- */
body.client .tabs,body.client .rail,body.client .statusbar{}
body.client .hide-client{display:none !important}
body.client .pbody input,body.client .pbody textarea{border:none;background:none;padding:0;pointer-events:none}

@media (max-width:820px){
  .flow{grid-template-columns:1fr}
  main{padding:16px 12px 80px}
  .mast-today{margin-inline-start:0;width:100%}
}
@media print{
  .masthead .rail,.tabs,.statusbar,.hide-client,.btn{display:none !important}
  body{background:#fff}
  .panel,.lane,.year,.alerts{border-color:#ccc;box-shadow:none}
  main{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-top">
    <img class="mark" id="mark" alt="مع الله">
    <div>
      <div class="mast-title">مع الله</div>
      <div class="mast-sub">لوحة تشغيل المشروع · ١٢ مقطعًا كل شهر · ١٤٤٨ هـ</div>
    </div>
    <div class="mast-today" id="todayChip">—</div>
  </div>
  <nav class="rail" id="rail" aria-label="أشهر السنة"></nav>
</header>

<nav class="tabs">
  <div class="tabs-in" id="tabs">
    <button data-view="flow" aria-current="true">التدفق</button>
    <button data-view="content">المحتوى</button>
    <button data-view="production">الإنتاج</button>
    <button data-view="publish">النشر</button>
    <button data-view="dues">المستحقات</button>
    <button data-view="team">الفريق والأسعار</button>
    <div class="spacer hide-client">
      <button class="btn ghost" id="clientBtn">عرض للعميل</button>
      <button class="btn ghost" id="exportBtn">تصدير الشهر</button>
    </div>
  </div>
</nav>

<main>
  <section id="view-flow">
    <p class="lead" id="flowLead"></p>
    <div class="flow" id="flow"></div>
    <div class="alerts" id="alerts"></div>
    <div class="year">
      <h3>خريطة السنة</h3>
      <div class="lead" style="margin:0">لكل شهر ثلاث نقاط: إعداد، إنتاج، نشر. اضغط الشهر لفتحه.</div>
      <div class="ygrid" id="ygrid"></div>
    </div>
  </section>

  <section id="view-content" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>جدول المحتوى</h2>
        <span class="note" id="contentNote"></span>
        <div class="right hide-client"><span class="chip" id="contentChip"></span></div>
      </div>
      <div class="scroll"><table id="contentTable"></table></div>
    </div>
  </section>

  <section id="view-production" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>جدول الإنتاج</h2>
        <span class="note" id="prodNote"></span>
        <div class="right hide-client"><span class="chip" id="prodChip"></span></div>
      </div>
      <div class="scroll"><table id="prodTable"></table></div>
    </div>
  </section>

  <section id="view-publish" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>جدول النشر</h2>
        <span class="note" id="pubNote"></span>
        <div class="right hide-client"><span class="chip" id="pubChip"></span></div>
      </div>
      <div class="cards" id="pubCards"></div>
    </div>
  </section>

  <section id="view-dues" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>مستحقات الشهر</h2>
        <span class="note" id="duesNote"></span>
      </div>
      <div class="scroll"><table id="duesTable"></table></div>
      <div class="totals" id="duesTotals"></div>
    </div>
  </section>

  <section id="view-team" hidden>
    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><h2>الأسعار الافتراضية للمهمة</h2></div>
        <div style="padding:8px 16px 16px" id="rates"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>الأدوار الثابتة</h2></div>
        <div style="padding:8px 16px 16px" id="roles"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>قاعدة التبكير</h2></div>
        <div style="padding:0 16px 16px" id="ruleBox"></div>
      </div>
    </div>
  </section>
</main>

<div class="statusbar" id="status"><span class="dotx"></span><span id="statusText">جارٍ الاتصال بالتخزين…</span><span class="sp" id="statusRight"></span></div>

<script>
/* ============ ثوابت المشروع ============ */
const YEAR = 1448;
const MONTHS = [
  {n:1,  name:"محرم",         s:"2026-06-16", e:"2026-07-14"},
  {n:2,  name:"صفر",          s:"2026-07-15", e:"2026-08-13"},
  {n:3,  name:"ربيع الأول",   s:"2026-08-14", e:"2026-09-11"},
  {n:4,  name:"ربيع الآخر",   s:"2026-09-12", e:"2026-10-11"},
  {n:5,  name:"جمادى الأولى", s:"2026-10-12", e:"2026-11-10"},
  {n:6,  name:"جمادى الآخرة", s:"2026-11-11", e:"2026-12-09"},
  {n:7,  name:"رجب",          s:"2026-12-10", e:"2027-01-08"},
  {n:8,  name:"شعبان",        s:"2027-01-09", e:"2027-02-07"},
  {n:9,  name:"رمضان",        s:"2027-02-08", e:"2027-03-08"},
  {n:10, name:"شوال",         s:"2027-03-09", e:"2027-04-07"},
  {n:11, name:"ذو القعدة",    s:"2027-04-08", e:"2027-05-06"},
  {n:12, name:"ذو الحجة",     s:"2027-05-07", e:"2027-06-05"}
];
const KINDS = [
  {id:"anim",   label:"أنميشن",      count:4},
  {id:"motion", label:"موشن صوتي",   count:4},
  {id:"clip",   label:"مقتطف إيماني",count:4}
];
const TASKS = [
  {id:"research", stage:"prep", title:"بحث وانتخاب ٨ مقاطع",        unit:8, who:"نواف / عمر"},
  {id:"script",   stage:"prep", title:"كتابة ٤ نصوص أنميشن",        unit:4, who:"يوسف"},
  {id:"vo",       stage:"prep", title:"تعليق صوتي ٤ تسجيلات",       unit:4, who:"أبو بندر"},
  {id:"anim",     stage:"prod", title:"رسم وتحريك ٤ مقاطع",         unit:4, who:"علي + ملك / نجود + ملك"},
  {id:"edit",     stage:"prod", title:"مونتاج ٤ مقتطفات",           unit:4, who:"مصطفى"},
  {id:"motion",   stage:"prod", title:"موشن ٤ صوتيات",              unit:4, who:"مصطفى"},
  {id:"comp",     stage:"prod", title:"كومبوزيتنغ ٤ مقاطع أنميشن",  unit:4, who:"مصطفى"},
  {id:"schedule", stage:"post", title:"نشر وجدولة محتوى الشهر",     unit:12,who:"ليمو"},
  {id:"payout",   stage:"post", title:"رفع مستحقات المبدعين",       unit:1, who:"رجب"}
];
const STAGES = {prep:{t:"الإعداد",off:-2},prod:{t:"الإنتاج",off:-1},post:{t:"النشر والتحصيل",off:0}};
const DEFAULT_RATES = {research:0,script:0,vo:0,anim:0,edit:0,motion:0,comp:0,schedule:0,payout:0};

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = i => YEAR + "-" + String(i).padStart(2,"0");
const M = i => MONTHS[i-1];
const fmtG = iso => { if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; };
const range = i => fmtG(M(i).s) + " – " + fmtG(M(i).e);
const todayISO = () => new Date().toISOString().slice(0,10);
const money = n => (Number(n)||0).toLocaleString("en-US");
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function currentMonthIndex(){
  const t = todayISO();
  for(const m of MONTHS){ if(t >= m.s && t <= m.e) return m.n; }
  return t < MONTHS[0].s ? 1 : 12;
}
function windowMonth(pubIdx, stage){ return pubIdx + STAGES[stage].off; }
function windowLabel(idx){
  if(idx >= 1) return M(idx).name + " " + YEAR + " هـ";
  const prev = [ "ذو الحجة", "ذو القعدة" ];
  return prev[Math.abs(idx)] + " " + (YEAR-1) + " هـ";
}
function windowEnd(idx){
  if(idx >= 1) return M(idx).e;
  const d = new Date(MONTHS[0].s); d.setDate(d.getDate() + 30*idx - 1);
  return d.toISOString().slice(0,10);
}

/* ============ الحالة ============ */
const S = { sel: currentMonthIndex(), view:"flow", months:{}, config:{rates:{...DEFAULT_RATES}}, db:null, assets:null, downloads:null, client:false };
let saveTimers = {}, lastWrite = 0, pendingRender = false;

function blankMonth(i){
  const content = [];
  KINDS.forEach(k => { for(let j=0;j<k.count;j++) content.push({kind:k.id,title:"",sheikh:"",dur:"",note:"",link:""}); });
  const tasks = {};
  TASKS.forEach(t => tasks[t.id] = {done:0, who:t.who, due:"", doneDate:"", note:""});
  const publish = content.map(() => ({caption:"",file:"",img:"",date:"",time:"",platform:"",status:"draft"}));
  const dues = {};
  TASKS.forEach(t => dues[t.id] = {amount:"", status:"pending", paidDate:""});
  return {content, tasks, publish, dues};
}
function getMonth(i){
  const k = key(i);
  if(!S.months[k]) S.months[k] = blankMonth(i);
  const m = S.months[k];
  if(!m.content) Object.assign(m, blankMonth(i));
  return m;
}
function dueOf(i, t){
  const m = getMonth(i);
  return (m.tasks[t.id] && m.tasks[t.id].due) || windowEnd(windowMonth(i, t.stage));
}
function taskState(i, t){
  const st = getMonth(i).tasks[t.id] || {done:0};
  const due = dueOf(i, t);
  if(st.done >= t.unit) {
    const over = st.doneDate && due && st.doneDate > due ? daysBetween(due, st.doneDate) : 0;
    return {code:"done", over};
  }
  const late = daysBetween(due, todayISO());
  if(late > 0) return {code:"late", days:late};
  if(late > -7) return {code:"soon", days:-late};
  return {code:"open", days:-late};
}
function stageProgress(i, stage){
  const list = TASKS.filter(t => t.stage === stage);
  let done = 0, total = 0;
  list.forEach(t => { total += t.unit; done += Math.min(t.unit, Number(getMonth(i).tasks[t.id]?.done)||0); });
  return {pct: total ? Math.round(done/total*100) : 0, done, total, list};
}
function contentProgress(i){
  const c = getMonth(i).content;
  const ready = c.filter(r => r.title && (r.link || r.note)).length;
  return {pct: Math.round(ready/12*100), ready};
}
function publishProgress(i){
  const p = getMonth(i).publish;
  const set = p.filter(r => r.date).length;
  return {pct: Math.round(set/12*100), set};
}

/* ============ التخزين ============ */
function setStatus(text, off){
  $("#statusText").textContent = text;
  $("#status").classList.toggle("off", !!off);
}
function localSave(){
  try{ localStorage.setItem("maallah-"+YEAR, JSON.stringify({months:S.months, config:S.config})); }catch(e){}
}
function localLoad(){
  try{
    const raw = localStorage.getItem("maallah-"+YEAR);
    if(raw){ const d = JSON.parse(raw); S.months = d.months||{}; S.config = Object.assign({rates:{...DEFAULT_RATES}}, d.config||{}); return true; }
  }catch(e){}
  return false;
}
function save(i){
  localSave();
  if(!S.db) { setStatus("محفوظ على هذا الجهاز فقط", true); return; }
  const k = key(i);
  clearTimeout(saveTimers[k]);
  saveTimers[k] = setTimeout(async () => {
    try{
      lastWrite = Date.now();
      await S.db.doc("months/"+k).set(JSON.parse(JSON.stringify(S.months[k])));
      setStatus("محفوظ · " + new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"}));
    }catch(e){ setStatus("تعذّر الحفظ: " + (e.code||"خطأ") + " — التعديلات محفوظة محليًا", true); }
  }, 500);
}
function saveConfig(){
  localSave();
  if(!S.db) return;
  clearTimeout(saveTimers.cfg);
  saveTimers.cfg = setTimeout(async () => {
    try{ lastWrite = Date.now(); await S.db.doc("config/main").set(JSON.parse(JSON.stringify(S.config))); }
    catch(e){ setStatus("تعذّر حفظ الإعدادات", true); }
  }, 500);
}
function safeRender(){
  const a = document.activeElement;
  if(a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName)){ pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRender){ pendingRender = false; setTimeout(render, 60); } });

async function connect(){
  let db = null;
  try{ db = await claude.use("db"); }catch(e){}
  if(!db){ setStatus("وضع محلي — البيانات على هذا الجهاز فقط", true); return; }
  S.db = db;
  setStatus("متصل بالتخزين المشترك");
  db.collection("months").onSnapshot(snap => {
    if(Date.now() - lastWrite < 900) return;
    snap.docs.forEach(d => { const data = d.data(); if(data) S.months[d.id] = data; });
    safeRender();
  }, e => setStatus("انقطع الاتصال (" + e.code + ") — أعد تحميل الصفحة", true));
  db.doc("config/main").onSnapshot(snap => {
    if(Date.now() - lastWrite < 900) return;
    const d = snap.data();
    if(d) S.config = Object.assign({rates:{...DEFAULT_RATES}}, d);
    safeRender();
  }, () => {});
  try{ S.assets = await claude.use("assets"); }catch(e){}
  try{ S.downloads = await claude.use("downloads"); }catch(e){}
  render();
}

/* ============ الرسم ============ */
function renderRail(){
  const cur = currentMonthIndex();
  $("#rail").innerHTML = MONTHS.map(m =>
    `<button data-m="${m.n}" class="${m.n===cur?"now":""}" aria-current="${m.n===S.sel}">${esc(m.name)}<span class="g">${fmtG(m.s).slice(0,5)} – ${fmtG(m.e).slice(0,5)}</span></button>`
  ).join("");
}
function renderFlow(){
  const i = S.sel, m = M(i);
  $("#flowLead").innerHTML = `شهر النشر: <b>${esc(m.name)} ${YEAR} هـ</b> (${range(i)}). لكي ينتظم النشر، يُجهَّز المحتوى قبل شهرين ويُنتَج قبل شهر.`;
  const lanes = ["prep","prod","post"].map((stage, n) => {
    const w = windowMonth(i, stage), p = stageProgress(i, stage);
    const states = p.list.map(t => taskState(i,t));
    const late = states.filter(s => s.code==="late").length;
    const st = p.pct===100 ? "done" : (late ? "late" : "open");
    const chip = p.pct===100 ? `<span class="chip done">مكتمل</span>`
      : late ? `<span class="chip late">${late} مهمة متأخرة</span>`
      : `<span class="chip">${p.total - p.done} عنصر متبقٍ</span>`;
    return `<div class="lane" data-state="${st}">
      <div class="lane-step">المرحلة ${["الأولى","الثانية","الثالثة"][n]}</div>
      <h3>${STAGES[stage].t}</h3>
      <div class="win">نافذة التنفيذ: ${esc(windowLabel(w))} · حتى ${fmtG(windowEnd(w))}</div>
      <div class="bar"><i style="width:${p.pct}%"></i></div>
      <div class="lane-meta"><span>${p.done} من ${p.total}</span>${chip}</div>
    </div>`;
  }).join("");
  $("#flow").innerHTML = lanes;

  const rows = [];
  TASKS.forEach(t => {
    const s = taskState(i,t);
    if(s.code==="late") rows.push(`<li><span>متأخر ${s.days} يومًا — ${esc(t.title)}</span><span class="who">${esc(getMonth(i).tasks[t.id].who||t.who)} · كان يجب الإنجاز ${fmtG(dueOf(i,t))}</span></li>`);
    else if(s.code==="done" && s.over>0) rows.push(`<li class="ok"><span>أُنجز متأخرًا ${s.over} يومًا — ${esc(t.title)}</span><span class="who">تجاوز نافذة ${esc(windowLabel(windowMonth(i,t.stage)))}</span></li>`);
  });
  $("#alerts").innerHTML = `<h3>ما الذي يعطّل الشهر؟</h3>` + (rows.length
    ? `<ul>${rows.join("")}</ul>`
    : `<ul><li class="ok"><span>لا يوجد تأخير مسجّل في ${esc(m.name)}.</span><span class="who">النشر يسير على المسار المخطط</span></li></ul>`);

  $("#ygrid").innerHTML = MONTHS.map(mm => {
    const c = contentProgress(mm.n).pct, pr = stageProgress(mm.n,"prod").pct, pb = publishProgress(mm.n).pct;
    return `<div class="ycell" data-m="${mm.n}" data-sel="${mm.n===S.sel}">
      <div class="m">${esc(mm.name)}</div><span class="g">${fmtG(mm.s).slice(0,5)}</span>
      <div class="dots">
        <div class="dot" title="الإعداد"><i style="width:${c}%"></i></div>
        <div class="dot" title="الإنتاج"><i style="width:${pr}%;background:var(--ink)"></i></div>
        <div class="dot" title="النشر"><i style="width:${pb}%;background:#8FD0A5"></i></div>
      </div></div>`;
  }).join("");
}

function renderDues(){
  const i = S.sel, m = getMonth(i);
  $("#duesNote").textContent = `تُحتسب على الشهر الهجري: ${M(i).name} ${YEAR} هـ = ${range(i)}`;
  const rates = S.config.rates || DEFAULT_RATES;
  let html = `<thead><tr><th>المهمة</th><th style="width:170px">المستفيد</th><th style="width:120px">الإنجاز</th>
    <th style="width:120px">المبلغ (ر.س)</th><th style="width:140px">الحالة</th><th style="width:140px">تاريخ التحويل</th></tr></thead><tbody>`;
  let due = 0, paid = 0, blocked = 0;
  TASKS.forEach(t => {
    const st = m.tasks[t.id], d = m.dues[t.id] || (m.dues[t.id] = {amount:"",status:"pending",paidDate:""});
    const complete = (Number(st.done)||0) >= t.unit;
    const amount = d.amount === "" ? (rates[t.id] || 0) : Number(d.amount);
    if(complete){ if(d.status==="paid") paid += amount; else due += amount; } else blocked++;
    const pct = Math.round(Math.min(1,(Number(st.done)||0)/t.unit)*100);
    html += `<tr>
      <td>${esc(t.title)}</td>
      <td>${esc(st.who || t.who)}</td>
      <td><span class="mini-bar"><i style="width:${pct}%;background:${complete?"var(--done)":"var(--sea)"}"></i></span>
        <span style="font-size:12px;color:var(--muted)"> ${Number(st.done)||0}/${t.unit}</span></td>
      <td><input type="number" min="0" data-d="${t.id}" data-f="amount" value="${d.amount===""?(rates[t.id]||""):esc(d.amount)}" placeholder="0"></td>
      <td>${complete
        ? `<select data-d="${t.id}" data-f="status">
             <option value="pending" ${d.status!=="paid"?"selected":""}>مستحق للتحويل</option>
             <option value="paid" ${d.status==="paid"?"selected":""}>محوّل</option>
           </select>`
        : `<span class="chip">لم يكتمل بعد</span>`}</td>
      <td><input type="date" data-d="${t.id}" data-f="paidDate" value="${esc(d.paidDate)}"></td>
    </tr>`;
  });
  $("#duesTable").innerHTML = html + "</tbody>";
  $("#duesTotals").innerHTML =
    `<div>مستحق للتحويل: <b class="tot-num">${money(due)}</b> ر.س</div>
     <div>محوّل: <b class="tot-num">${money(paid)}</b> ر.س</div>
     <div>مهام لم تكتمل: <b class="tot-num">${blocked}</b></div>
     <div style="color:var(--muted)">الإجمالي المرصود للشهر: <b class="tot-num">${money(due+paid)}</b> ر.س</div>`;
}

function render(){
  renderRail();
  $("#todayChip").textContent = "اليوم: " + M(currentMonthIndex()).name + " " + YEAR + " هـ · " + fmtG(todayISO());
  const v = S.view;
  ["flow","content","production","publish","dues","team"].forEach(x => $("#view-"+x).hidden = (x!==v));
  document.querySelectorAll("#tabs button[data-view]").forEach(b => b.setAttribute("aria-current", b.dataset.view===v));
  if(v==="flow") renderFlow();
  if(v==="content") renderContent();
  if(v==="production") renderProduction();
  if(v==="publish") renderPublish();
  if(v==="dues") renderDues();
  if(v==="team") renderTeam();
  $("#statusRight").textContent = M(S.sel).name + " " + YEAR + " هـ · " + range(S.sel);
}

/* ============ التفاعل ============ */
document.addEventListener("click", e => {
  const tab = e.target.closest("#tabs button[data-view]");
  if(tab){ S.view = tab.dataset.view; render(); return; }
  const railBtn = e.target.closest("#rail button[data-m]") || e.target.closest(".ycell[data-m]");
  if(railBtn){ S.sel = Number(railBtn.dataset.m); render(); return; }
  const step = e.target.closest("button[data-step]");
  if(step){
    const t = TASKS.find(x => x.id === step.dataset.t), m = getMonth(S.sel);
    let v = (Number(m.tasks[t.id].done)||0) + Number(step.dataset.step);
    v = Math.max(0, Math.min(t.unit, v));
    m.tasks[t.id].done = v;
    if(v >= t.unit && !m.tasks[t.id].doneDate) m.tasks[t.id].doneDate = todayISO();
    if(v < t.unit) m.tasks[t.id].doneDate = "";
    save(S.sel); render(); return;
  }
  if(e.target.id === "clientBtn"){
    S.client = !S.client;
    document.body.classList.toggle("client", S.client);
    e.target.textContent = S.client ? "عودة للتحرير" : "عرض للعميل";
    return;
  }
  if(e.target.id === "exportBtn") exportMonth();
});

document.addEventListener("input", e => {
  const el = e.target, m = getMonth(S.sel);
  if(el.dataset.c !== undefined && el.dataset.f){ m.content[+el.dataset.c][el.dataset.f] = el.value; save(S.sel); return; }
  if(el.dataset.p !== undefined && el.dataset.f){ m.publish[+el.dataset.p][el.dataset.f] = el.value; save(S.sel); return; }
  if(el.dataset.t && el.dataset.f){
    const t = TASKS.find(x => x.id === el.dataset.t);
    let v = el.value;
    if(el.dataset.f === "done"){
      v = Math.max(0, Math.min(t.unit, Number(v)||0));
      if(v >= t.unit && !m.tasks[t.id].doneDate) m.tasks[t.id].doneDate = todayISO();
    }
    m.tasks[t.id][el.dataset.f] = v;
    save(S.sel); return;
  }
  if(el.dataset.d && el.dataset.f){ (m.dues[el.dataset.d] ||= {amount:"",status:"pending",paidDate:""})[el.dataset.f] = el.value; save(S.sel); return; }
  if(el.dataset.r){ (S.config.rates ||= {})[el.dataset.r] = el.value; saveConfig(); return; }
});
document.addEventListener("change", e => {
  const el = e.target, m = getMonth(S.sel);
  if(el.dataset.d && el.dataset.f === "status"){
    const d = (m.dues[el.dataset.d] ||= {amount:"",status:"pending",paidDate:""});
    d.status = el.value;
    if(el.value === "paid" && !d.paidDate) d.paidDate = todayISO();
    save(S.sel); render(); return;
  }
  if(el.dataset.up !== undefined && el.files && el.files[0]) uploadImage(+el.dataset.up, el.files[0]);
});

async function uploadImage(idx, file){
  if(!S.assets) return;
  setStatus("جارٍ رفع الصورة…");
  try{
    const res = await S.assets.upload(file);
    getMonth(S.sel).publish[idx].img = res.id;
    save(S.sel); render();
    setStatus("تم رفع الصورة");
  }catch(err){ setStatus("تعذّر رفع الصورة (" + (err.code||"خطأ") + ")", true); }
}

function exportMonth(){
  const i = S.sel, m = getMonth(i);
  const rows = [["#","النوع","العنوان","الشيخ","المدة","الرابط","تاريخ النشر"]];
  m.content.forEach((c, n) => rows.push([n+1, kindLabel(c.kind), c.title, c.sheikh, c.dur, c.link, m.publish[n].date]));
  rows.push([]);
  rows.push(["المهمة","المسؤول","آخر موعد","المنجز","تاريخ الإنجاز","المبلغ","حالة الصرف"]);
  TASKS.forEach(t => {
    const st = m.tasks[t.id], d = m.dues[t.id]||{};
    rows.push([t.title, st.who||t.who, dueOf(i,t), (st.done||0)+"/"+t.unit, st.doneDate, d.amount||(S.config.rates?.[t.id]||0), d.status==="paid"?"محوّل":"مستحق"]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(x => `"${String(x==null?"":x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const name = `مع-الله-${M(i).name}-${YEAR}.csv`;
  if(S.downloads){ S.downloads.save({filename:name, data:csv}).catch(()=>{}); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
